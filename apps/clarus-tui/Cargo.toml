[package]
name = "clarus-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
description = "Keyboard-first terminal music client for Clarus Music"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
clarus-core = { path = "../../crates/clarus-core" }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
libc = "0.2"
qrcode = { version = "0.14.1", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
rodio = { version = "0.22.2", default-features = false, features = ["flac", "mp3", "mp4", "playback", "vorbis", "wav"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
