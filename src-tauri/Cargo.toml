[package]
name = "simplemusic"
version = "0.1.0"
description = "A performance-first desktop music player"
authors = ["Clarus Music contributors"]
license = "GPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "simplemusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
atomic-write-file = "0.3.0"
bytes = "1"
futures-util = "0.3"
keyring = "4.1.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
log = "0.4"
md-5 = "0.10"
ncm-api-rs = "0.1.0"
unm_engine = "0.4.0"
unm_engine_kugou = "0.4.0"
unm_engine_ytdl = "0.4.0"
unm_request = "0.4.0"
unm_types = "0.4.0"
tauri = { version = "2.11.3", features = ["protocol-asset", "unstable"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "sync", "time"] }
zeroize = "1.8"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSButtonTouchBarItem", "NSResponder", "NSTouchBar", "NSTouchBarItem", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSSet", "NSString", "std"] }

[dev-dependencies]
tempfile = "3.27"
