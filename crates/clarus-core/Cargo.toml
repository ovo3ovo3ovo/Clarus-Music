[package]
name = "clarus-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
description = "UI-independent music services shared by Clarus clients"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.22"
fs2 = "0.4.3"
keyring = "4.1.5"
md-5 = "0.10"
ncm-api-rs = "0.1.0"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
url = "2"
urlencoding = "2"
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tiny_http = "0.12"
